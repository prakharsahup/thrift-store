<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f6f3fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #120d1a;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 24px; font-size: 20px; font-weight: bold">Le.Jao.Bhai</p>
          <p style="margin: 0 0 16px; font-size: 16px">Here's your sign-in code:</p>
          <p
            style="
              margin: 0 0 24px;
              font-size: 36px;
              font-weight: bold;
              letter-spacing: 8px;
              color: #6c2bd9;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0 0 8px; font-size: 14px; color: #645c70">
            Type it on the sign-in page. It expires in 1 hour.
          </p>
          <p style="margin: 0; font-size: 14px; color: #645c70">
            If you didn't ask for this, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
